; Preset de exemplo: só as chaves que você quer mudar.
; Os nomes de seção/chave variam entre versões do iRacing. ANTES de aplicar, confirme que
; a chave existe no seu arquivo:
;   python iracing/iracing_ini.py get rendererDX11Monitor.ini <Secao> <Chave>
; Mude UMA coisa por vez e rode um benchmark depois de cada mudança (veja docs/metodo.md).
;
; Exemplo (descomente e ajuste depois de confirmar o nome/seção no seu arquivo):
; [Drawing]
; VisibilityFrameDelay=0
